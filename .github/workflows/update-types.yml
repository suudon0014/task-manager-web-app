name: Auto Generate Supabase Types

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 0 * * *' # 毎日 UTC 0:00（日本時間 午前9:00）に定期実行
  workflow_dispatch: # 手動実行も可能にする

permissions:
  contents: write # リポジトリへの自動コミット・プッシュに必要

jobs:
  update-types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate Types
        run: |
          # CLIを使って型定義を生成
          npx supabase gen types typescript --project-id "${{ secrets.SUPABASE_PROJECT_ID }}" > src/types/supabase.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Check for changes
        id: git-check
        run: |
          # 差分があるか確認
          git diff --exit-code src/types/supabase.ts || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and Push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/types/supabase.ts
          git commit -m "chore: auto-update supabase types [skip ci]"
          git push
